name: Accessibility regression

on:
  pull_request:

permissions:
  contents: read

jobs:
  accessibility-regression:
    name: Compare base and PR accessibility
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      TEST_URL: ${{ vars.TEST_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate comparison URLs
        shell: bash
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$TEST_URL" ]; then
            echo "BASE_URL and TEST_URL repository variables must both be configured."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npx vitest run unit-tests

      - name: Type-check
        run: npx tsc --noEmit

      - name: Compare accessibility
        run: npx playwright test --project=chromium

      - name: Publish accessibility report
        if: always()
        shell: bash
        run: |
          if [ -f test-results/accessibility-report.md ]; then
            cat test-results/accessibility-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Accessibility regression check" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No accessibility report was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

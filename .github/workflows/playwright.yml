name: Accessibility Checks
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      TEST_URL: ${{ vars.TEST_URL }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate comparison URLs
        shell: bash
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$TEST_URL" ]; then
            echo "BASE_URL and TEST_URL repository variables must both be configured."
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run unit tests
        run: npx vitest run unit-tests
      - name: Type-check
        run: npx tsc --noEmit
      - name: Run accessibility tests
        run: npm run test:a11y
      - name: Add accessibility report to job summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ -f test-results/accessibility-report.md ]; then
            cat test-results/accessibility-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Accessibility regression check" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No accessibility report was generated." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Comment accessibility report on PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const reportPath = "test-results/accessibility-report.md";

            if (!fs.existsSync(reportPath)) {
              core.warning("No accessibility Markdown report was created.");
              return;
            }

            const marker = "<!-- accessibility-report -->";
            const report = fs.readFileSync(reportPath, "utf8");
            const body = `${marker}\n${report}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            );
            const previousComment = comments.find(
              (comment) =>
                comment.user?.type === "Bot" &&
                comment.body?.includes(marker),
            );

            if (previousComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previousComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

name: a11y-diff Accessibility Checks
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Compare accessibility
        id: accessibility
        # uses: ./ means run the action.yml located at the root of this checked-out repository
        uses: ./
        with:
          base-url: ${{ vars.BASE_URL }}
          test-url: ${{ vars.TEST_URL }}

      - name: Run unit tests
        if: ${{ !cancelled() }}
        run: npx vitest run unit-tests

      - name: Type-check
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit

      - name: Comment accessibility report on PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v9
        env:
          REPORT_PATH: ${{ steps.accessibility.outputs.report-path }}
        with:
          script: |
            const fs = require("fs");
            const reportPath = process.env.REPORT_PATH;

            if (!fs.existsSync(reportPath)) {
              core.warning("No accessibility Markdown report was created.");
              return;
            }

            const marker = "<!-- accessibility-report -->";
            const report = fs.readFileSync(reportPath, "utf8");
            const body = `${marker}\n${report}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            );
            const previousComment = comments.find(
              (comment) =>
                comment.user?.type === "Bot" &&
                comment.body?.includes(marker),
            );

            if (previousComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previousComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
